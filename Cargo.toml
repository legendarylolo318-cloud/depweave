[workspace]
resolver = "2"
members = ["crates/core", "crates/render", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
petgraph = "0.6"
tar = "0.4"
flate2 = "1"
ruzstd = "0.7"
lzma-rs = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rstar = "0.12"
tiny-skia = "0.11"
fontdue = "0.9"
slint = { version = "1.8", default-features = false, features = ["std", "backend-winit", "backend-winit-x11", "backend-winit-wayland", "renderer-software", "software-renderer-systemfonts", "accessibility", "compat-1-2"] }
slint-build = "1.8"
notify = "6"
fuzzy-matcher = "0.3"
clap = { version = "4", features = ["derive"] }
png = "0.17"
dirs = "5"
env_logger = "0.11"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
